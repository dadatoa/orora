name: Template Sync

on:
  schedule:
    - cron: '0 2 * * 0' # Every Sunday at 02:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.SYNC_PAT }}

      - name: Template Sync
        uses: AndreasAugustin/actions-template-sync@v2.6.0
        with:
          source_repo_path: ublue-os/image-template
          upstream_branch: main
          source_gh_token: ${{ secrets.SYNC_PAT }}
          pr_title: "chore: sync from image-template"
          pr_body: |
            This PR was generated by [actions-template-sync](https://github.com/AndreasAugustin/actions-template-sync).
            It syncs this repository with the latest changes from the upstream template.
          pr_labels: "chore,📚 template-sync"